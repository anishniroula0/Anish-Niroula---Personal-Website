<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Architectural Alabaster Background -->
  <rect width="64" height="64" rx="14" fill="#F6F5F0" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#DCD8CD" stroke-width="1.5" />
  <!-- Corner CAD brackets -->
  <path d="M 6 14 L 6 6 L 14 6" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
  <path d="M 58 50 L 58 58 L 50 58" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
  <!-- Transmission Tower Lattice Structure in Cerulean & Ink -->
  <line x1="22" y1="56" x2="30" y2="16" stroke="#182230" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="56" x2="34" y2="16" stroke="#182230" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="16" x2="32" y2="10" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="16" x2="32" y2="10" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
  <!-- Crossarms -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#0369A1" stroke-width="2.2" stroke-linecap="round" />
  <line x1="14" y1="28" x2="50" y2="28" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="36" x2="46" y2="36" stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" />
  <!-- Lattice X Bracing -->
  <line x1="24" y1="50" x2="40" y2="40" stroke="#0369A1" stroke-width="1.4" />
  <line x1="40" y1="50" x2="24" y2="40" stroke="#0369A1" stroke-width="1.4" />
  <line x1="26" y1="40" x2="38" y2="30" stroke="#0369A1" stroke-width="1.4" />
  <line x1="38" y1="40" x2="26" y2="30" stroke="#0369A1" stroke-width="1.4" />
  <!-- Insulator Discs & Amber Spark Pulse -->
  <circle cx="16" cy="22" r="2" fill="#B45309" />
  <circle cx="48" cy="22" r="2" fill="#B45309" />
  <circle cx="32" cy="10" r="2.2" fill="#0369A1" />
</svg>
